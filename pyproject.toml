[project]
name = "notebook-rental-ml"
version = "0.1.0"
description = "노트북 반납 손상 검사 - ML 추론 서비스(1단계: 사전학습 모델 + 변화 탐지)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10",
  "onnxruntime>=1.18",
  "boto3>=1.34",
]

[project.optional-dependencies]
# 인텔 CPU에서 더 빠를 수 있는 추론 엔진. 추론 튜닝에서 비교한다.
openvino = ["openvino>=2024.3"]
# 모델을 ONNX로 내보낼 때만 필요하다(운영 이미지에는 넣지 않는다).
export = ["torch>=2.4", "onnx>=1.16", "timm>=1.0"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "onnx>=1.16",
  "moto[s3]>=5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["common*", "inference*", "bench*"]

# 프로파일 설정 파일(local.env, prod.env)도 패키지에 넣는다. 빠지면 운영에서 prod.env가 조용히 무시된다.
[tool.setuptools.package-data]
inference = ["config/*.env"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "regression: 고정 전/후 샘플 이미지로 후보 위치·개수를 확인하는 회귀 테스트",
]

[tool.coverage.run]
source = ["common", "inference"]
branch = true

[tool.coverage.report]
# 사용자 요구(2026-11-04): 커버리지 80% 미만이면 CI 실패
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# E501: 한국어 주석·문서 문자열은 줄 길이를 강제하지 않는다(코드 길이는 ruff format이 맞춘다)
ignore = ["B008", "E501"]
