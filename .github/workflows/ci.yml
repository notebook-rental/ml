# ml CI (tasks T017): 린트 → 단위·계약·회귀 테스트 → 커버리지 80% 미만이면 실패 → 속도 측정(참고용)
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 의존성 설치
        run: pip install -e ".[dev]"
      - name: 린트(ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: 테스트 + 커버리지(80% 미만이면 실패)
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: 속도 측정(같은 구조 무작위 가중치 모델, 참고용)
        run: |
          mkdir -p .data/models
          python tools/build_vit_onnx.py --out .data/models/vit-s14-448x336.onnx
          python -m bench.bench_compare --backbone .data/models/vit-s14-448x336.onnx --runs 6 \
            --concurrency 1 3 --out bench-result.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-and-bench
          path: |
            coverage.xml
            bench-result.json
